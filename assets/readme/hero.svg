  <title id="heroTitle">video-transcript — 把视频链接变成可用的文字稿</title>
  <desc id="heroDesc">左侧为项目名称与定位：字幕优先、零转码依赖、转写后强制校对，支持 B 站、YouTube、播客与本地文件。右侧为真实产出形态：一段音轨波形经语音转写后变成带时间戳的文字稿。</desc>

